# matrix2078 sample configuration.
# Every field can be overridden with MATRIX2078_* env vars (see README).
# Note: no homeserver/room config is required — homeserver can come from the
# IRC realname (GECOS) field and all joined rooms are bridged automatically.

# IRC listen address. Default: 127.0.0.1:2078
listen = "127.0.0.1:2078"

# Local media server (serves authenticated downloads at stable URLs).
# Default: 127.0.0.1:2079
media_listen = "127.0.0.1:2079"

# IRC network/server name shown to clients.
server_name = "matrix2078"

# Where encrypted sessions and matrix-sdk state live. Gitignored.
state_dir = "./state"

# Homeserver base URL. Optional: the IRC realname (GECOS) field takes
# priority, then this, then the stored session's homeserver.
# homeserver = "https://matrix.doesnmlab.xyz"


[bridge]
# Maximum nicks sent in NAMES/353 and WHO/352 replies. Huge Matrix rooms
# (thousands of members) freeze IRC clients if sent in full.
names_limit = 200
